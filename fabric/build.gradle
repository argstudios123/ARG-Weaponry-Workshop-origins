plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

// One switch for the dev-runtime renderer testing aids and the graphics backend choice; see the
// dependencies block and the client run below. It is a dev-run setting only and never affects a build.
def argRenderers = providers.gradleProperty('argRenderers').map { it.toBoolean() }.getOrElse(false)

repositories {
    maven {
        name = "CurseMaven"
        url = "https://cursemaven.com"
    }
    maven {
        url = "https://api.modrinth.com/maven"
    }
    // Mod Menu's official Maven, used for the compile-only API of the optional integration.
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/releases/"
    }
}


dependencies {
    minecraft("com.mojang:minecraft:${minecraft_version}")
    implementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // Sodium and Iris are OPT-IN, dev-runtime-only renderer testing aids - never mod dependencies:
    // both are OpenGL-only renderers, and this Minecraft version cannot start its OpenGL backend on every
    // machine (here it fails with EGL_BAD_DISPLAY in SDL3/NVIDIA under Wayland, so the game runs on Vulkan).
    // Loading them next to the Vulkan backend aborts the JVM inside Iris' GL initialiser (SIGABRT), which is
    // why the default run client does not load them. Enable them where the OpenGL backend does start:
    //     ./gradlew :fabric:runClient -PargRenderers=true
    if (argRenderers) {
        runtimeOnly("maven.modrinth:sodium:mc26.3-0.9.2-fabric")
        runtimeOnly("maven.modrinth:iris:1.11.7+26.3-fabric")
    }
    // Architectury API (architectury_version 22.0.5), CurseForge file 9111314 - required at runtime.
    // modImplementation (not implementation) is required so Loom remaps the production jar to the
    // development mappings; an unremapped mod jar cannot be loaded by a Loom development runtime.
    // Architectury API (architectury_version 22.0.5), CurseForge file 9111314 - required at runtime.
    // Minecraft 26.3 ships unobfuscated, so Loom 1.18 runs with loom.disableObfuscation() == true and
    // does not create the remapping "mod*" configurations (modImplementation and friends) at all.
    // Plain implementation is therefore the correct way to declare a mod dependency here; the jar is
    // already compiled against the official names the development runtime uses.
    implementation("curse.maven:architectury-api-419699:9111314")

    // Mod Menu is an OPTIONAL, client-only integration: compileOnly keeps its classes out of the runtime
    // classpath and out of every produced jar, so the mod loads and behaves identically without it.
    // The "modmenu" entrypoint in fabric.mod.json is the only reference, and Mod Menu is the only thing
    // that resolves it.
    compileOnly("com.terraformersmc:modmenu:${modmenu_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            // Start on the Vulkan backend, which is the one Minecraft 26.3 can create here. Without the
            // argument the game tries OpenGL first, fails with EGL_BAD_DISPLAY and only then falls back - a
            // failed attempt plus a backend error on every launch. A machine without Vulkan still falls back
            // to OpenGL automatically, and the argument is skipped while the GL-only renderers are enabled.
            if (!argRenderers) {
                programArgs '--graphicsBackend', 'vulkan'
            }
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named(variant) {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named(variant) {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}
